rker-end="url(#arrow)"/><path d="M655 1250 H465" fill="none" stroke="#969aa1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g><rect x="722" y="205" width="184" height="31" rx="9" fill="#fbfbf8"/><text x="814" text-anchor="middle" fill="#73777d" font-size="18" font-weight="500"><tspan x="814" y="226">读取当前购物车</tspan></text></g><g><rect x="1344" y="311" width="70" height="31" rx="9" fill="#fbfbf8"/><text x="1379" text-anchor="middle" fill="#73777d" font-size="18" font-weight="500"><tspan x="1379" y="332">成功</tspan></text></g><g><rect x="1345" y="455" width="110" height="31" rx="9" fill="#fbfbf8"/><text x="1400" text-anchor="middle" fill="#73777d" font-size="18" font-weight="500"><tspan x="1400" y="476">加载失败</tspan></text></g><g><rect x="499" y="745" width="72" height="31" rx="9" fill="#fbfbf8"/><text x="535" text-anchor="middle" fill="#73777d" font-size="18" font-weight="500"><tspan x="535" y="766">确认</tspan></text></g><g><rect x="107" y="745" width="72" height="31" rx="9" fill="#fbfbf8"/><text x="143" text-anchor="middle" fill="#73777d" font-size="18" font-weight="500"><tspan x="143" y="766">取消</tspan></text></g><g><rect x="1040" y="895" width="136" height="31" rx="9" fill="#fbfbf8"/><text x="1108" text-anchor="middle" fill="#73777d" font-size="18" font-weight="500"><tspan x="1108" y="916">失败 / 超时</tspan></text></g><g><rect x="1344" y="1009" width="70" height="31" rx="9" fill="#fbfbf8"/><text x="1379" text-anchor="middle" fill="#73777d" font-size="18" font-weight="500"><tspan x="1379" y="1030">成功</tspan></text></g><g><rect x="490" y="1076" width="140" height="31" rx="9" fill="#fbfbf8"/><text x="560" text-anchor="middle" fill="#73777d" font-size="18" font-weight="500"><tspan x="560" y="1097">还有其他店</tspan></text></g><g><rect x="856" y="1173" width="116" height="31" rx="9" fill="#fbfbf8"/><text x="914" text-anchor="middle" fill="#73777d" font-size="18" font-weight="500"><tspan x="914" y="1194">已无商品</tspan></text></g><g><rect x="135" y="200" width="330" height="80" rx="16" fill="#fff" stroke="#e1e3e7" stroke-width="2"/><text x="300" text-anchor="middle" fill="#292b2f" font-size="21" font-weight="500"><tspan x="300" y="247">打开购物车</tspan></text></g><g><rect x="1175" y="200" width="330" height="80" rx="16" fill="#fff" stroke="#e1e3e7" stroke-width="2"/><text x="1340" text-anchor="middle" fill="#292b2f" font-size="21" font-weight="500"><tspan x="1340" y="247">① 读取当前购物车</tspan></text></g><g><rect x="655" y="330" width="330" height="80" rx="16" fill="#fff" stroke="#e1e3e7" stroke-width="2"/><text x="820" text-anchor="middle" fill="#292b2f" font-size="21" font-weight="500"><tspan x="820" y="362">展示最新门店分组</tspan><tspan x="820" y="392">与已选商品</tspan></text></g><g><rect x="135" y="330" width="330" height="80" rx="16" fill="#fff" stroke="#e1e3e7" stroke-width="2"/><text x="300" text-anchor="middle" fill="#292b2f" font-size="21" font-weight="500"><tspan x="300" y="362">点击目标店铺</tspan><tspan x="300" y="392">删除图标</tspan></text></g><g><rect x="655" y="449" width="330" height="82" rx="16" fill="#fff4ef" stroke="#e1e3e7" stroke-width="2"/><text x="820" text-anchor="middle" fill="#292b2f" font-size="19" font-weight="500"><tspan x="820" y="482">购物车加载失败，请重试</tspan><tspan x="820" y="512">点击重试 → 返回步骤①</tspan></text></g><g><rect x="655" y="570" width="330" height="80" rx="16" fill="#fff" stroke="#e1e3e7" stroke-width="2"/><text x="820" text-anchor="middle" fill="#292b2f" font-size="21" font-weight="500"><tspan x="820" y="602">确认弹窗明确店名、数量</tspan><tspan x="820" y="632">说明其他店商品保留</tspan></text></g><g><path d="M300 732 L406 780 L300 828 L194 780 Z" fill="#fff9df" stroke="#ddc96b" stroke-width="2"/><text x="300" text-anchor="middle" fill="#292b2f" font-size="20" font-weight="600"><tspan x="300" y="786">确认删除？</tspan></text></g><g><rect x="655" y="740" width="330" height="80" rx="16" fill="#fff" stroke="#e1e3e7" stroke-width="2"/><text x="820" text-anchor="middle" fill="#292b2f" font-size="21" font-weight="500"><tspan x="820" y="772">显示「删除中…」</tspan><tspan x="820" y="802">禁用同次重复确认</tspan></text></g><g><rect x="1175" y="730" width="330" height="100" rx="16" fill="#fff" stroke="#e1e3e7" stroke-width="2"/><text x="1340" text-anchor="middle" fill="#292b2f" font-size="20" font-weight="500"><tspan x="1340" y="757">② 处理目标店铺全部商品</tspan><tspan x="1340" y="787">重试先识别同次结果</tspan><tspan x="1340" y="817">避免重复处理</tspan></text></g><g><rect x="135" y="890" width="330" height="80" rx="16" fill="#f9f9f9" stroke="#e1e3e7" stroke-width="2"/><text x="300" text-anchor="middle" fill="#292b2f" font-size="21" font-weight="500"><tspan x="300" y="922">返回购物车</tspan><tspan x="300" y="952">全部商品保持不变</tspan></text></g><g><path d="M1340 882 L1446 930 L1340 978 L1234 930 Z" fill="#fff9df" stroke="#ddc96b" stroke-width="2"/><text x="1340" text-anchor="middle" fill="#292b2f" font-size="20" font-weight="600"><tspan x="1340" y="936">处理结果</tspan></text></g><g><rect x="655" y="888" width="330" height="145" rx="16" fill="#fff4ef" stroke="#e1e3e7" stroke-width="2"/><text x="820" text-anchor="middle" fill="#292b2f" font-size="18" font-weight="500"><tspan x="820" y="920">保留商品与失败／超时提示</tspan><tspan x="820" y="950">再次点击本店垃圾桶</tspan><tspan x="820" y="980">重新确认删除，或刷新后再操作</tspan><tspan x="820" y="1010">核对上次结果 → 返回步骤②</tspan></text></g><g><rect x="1175" y="1070" width="330" height="80" rx="16" fill="#fff" stroke="#e1e3e7" stroke-width="2"/><text x="1340" text-anchor="middle" fill="#292b2f" font-size="21" font-weight="500"><tspan x="1340" y="1117">返回处理后的购物车</tspan></text></g><g><rect x="655" y="1070" width="330" height="80" rx="16" fill="#fff9df" stroke="#dfce79" stroke-width="2"/><text x="820" text-anchor="middle" fill="#292b2f" font-size="21" font-weight="500"><tspan x="820" y="1102">删除目标店分组</tspan><tspan x="820" y="1132">更新金额与凑单入口</tspan></text></g><g><rect x="135" y="1070" width="330" height="80" rx="16" fill="#fff" stroke="#e1e3e7" stroke-width="2"/><text x="300" text-anchor="middle" fill="#292b2f" font-size="21" font-weight="500"><tspan x="300" y="1102">保留其他店选择</tspan><tspan x="300" y="1132">继续整理或选购</tspan></text></g><g><rect x="655" y="1210" width="330" height="80" rx="16" fill="#fff9df" stroke="#dfce79" stroke-width="2"/><text x="820" text-anchor="middle" fill="#292b2f" font-size="21" font-weight="500"><tspan x="820" y="1242">展示空购物车</tspan><tspan x="820" y="1272">提供返回选购入口</tspan></text></g><g><rect x="135" y="1210" width="330" height="80" rx="16" fill="#ffe052" stroke="#e8c82e" stroke-width="2"/><text x="300" text-anchor="middle" fill="#292b2f" font-size="21" font-weight="500"><tspan x="300" y="1257">返回选购</tspan></text></g><text x="82" y="1360" font-size="18" fill="#75787d">仅在删除成功后移除目标店商品。失败或超时保留当前列表；重试由系统识别同一次操作的实际结果。</text></svg>
