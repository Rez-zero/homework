ct x="1034" y="786" width="136" height="31" rx="9" fill="#fbfbf8"/><text x="1102" text-anchor="middle" fill="#73777d" font-size="18" font-weight="500"><tspan x="1102" y="807">失败 / 超时</tspan></text></g><g><rect x="1344" y="892" width="70" height="31" rx="9" fill="#fbfbf8"/><text x="1379" text-anchor="middle" fill="#73777d" font-size="18" font-weight="500"><tspan x="1379" y="913">成功</tspan></text></g><g><rect x="455" y="786" width="110" height="31" rx="9" fill="#fbfbf8"/><text x="510" text-anchor="middle" fill="#73777d" font-size="18" font-weight="500"><tspan x="510" y="807">点击重试</tspan></text></g><g><rect x="310.5" y="1044" width="185" height="31" rx="9" fill="#fbfbf8"/><text x="403" text-anchor="middle" fill="#73777d" font-size="18" font-weight="500"><tspan x="403" y="1065">满足原结算条件</tspan></text></g><g><rect x="135" y="200" width="330" height="80" rx="16" fill="#fff" stroke="#e1e3e7" stroke-width="2"/><text x="300" text-anchor="middle" fill="#292b2f" font-size="21" font-weight="500"><tspan x="300" y="232">点击本店</tspan><tspan x="300" y="262">「推荐凑单」</tspan></text></g><g><rect x="655" y="200" width="330" height="80" rx="16" fill="#fff" stroke="#e1e3e7" stroke-width="2"/><text x="820" text-anchor="middle" fill="#292b2f" font-size="21" font-weight="500"><tspan x="820" y="232">定位本店商品区域</tspan><tspan x="820" y="262">打开凑单助手</tspan></text></g><g><rect x="1175" y="200" width="330" height="80" rx="16" fill="#fff" stroke="#e1e3e7" stroke-width="2"/><text x="1340" text-anchor="middle" fill="#292b2f" font-size="21" font-weight="500"><tspan x="1340" y="232">提供本店商品价格</tspan><tspan x="1340" y="262">与当前购买状态</tspan></text></g><g><rect x="655" y="330" width="330" height="80" rx="16" fill="#fff" stroke="#e1e3e7" stroke-width="2"/><text x="820" text-anchor="middle" fill="#292b2f" font-size="21" font-weight="500"><tspan x="820" y="362">展示商品列表</tspan><tspan x="820" y="392">与本店起送差额</tspan></text></g><g><rect x="135" y="330" width="330" height="80" rx="16" fill="#fff" stroke="#e1e3e7" stroke-width="2"/><text x="300" text-anchor="middle" fill="#292b2f" font-size="21" font-weight="500"><tspan x="300" y="362">筛选商品、独立选择</tspan><tspan x="300" y="392">调整规格与数量</tspan></text></g><g><rect x="655" y="460" width="330" height="80" rx="16" fill="#fff" stroke="#e1e3e7" stroke-width="2"/><text x="820" text-anchor="middle" fill="#292b2f" font-size="21" font-weight="500"><tspan x="820" y="492">保存未提交选择</tspan><tspan x="820" y="522">更新预览金额与进度</tspan></text></g><g><rect x="135" y="610" width="330" height="80" rx="16" fill="#fff" stroke="#e1e3e7" stroke-width="2"/><text x="300" text-anchor="middle" fill="#292b2f" font-size="21" font-weight="500"><tspan x="300" y="657">确认本次加购</tspan></text></g><g><rect x="655" y="610" width="330" height="80" rx="16" fill="#fff" stroke="#e1e3e7" stroke-width="2"/><text x="820" text-anchor="middle" fill="#292b2f" font-size="21" font-weight="500"><tspan x="820" y="642">显示「加购中…」</tspan><tspan x="820" y="672">阻止同次重复确认</tspan></text></g><g><rect x="1175" y="600" width="330" height="100" rx="16" fill="#fff" stroke="#e1e3e7" stroke-width="2"/><text x="1340" text-anchor="middle" fill="#292b2f" font-size="20" font-weight="500"><tspan x="1340" y="627">校验商品并处理加购</tspan><tspan x="1340" y="657">重试识别同次结果</tspan><tspan x="1340" y="687">避免重复写入</tspan></text></g><g><path d="M1340 772 L1446 820 L1340 868 L1234 820 Z" fill="#fff9df" stroke="#ddc96b" stroke-width="2"/><text x="1340" text-anchor="middle" fill="#292b2f" font-size="20" font-weight="600"><tspan x="1340" y="826">处理结果</tspan></text></g><g><rect x="655" y="770" width="330" height="100" rx="16" fill="#fff4ef" stroke="#e1e3e7" stroke-width="2"/><text x="820" text-anchor="middle" fill="#292b2f" font-size="20" font-weight="500"><tspan x="820" y="797">保留本次选择</tspan><tspan x="820" y="827">显示失败或超时提示</tspan><tspan x="820" y="857">提供重试入口</tspan></text></g><g><rect x="1175" y="940" width="330" height="80" rx="16" fill="#fff" stroke="#e1e3e7" stroke-width="2"/><text x="1340" text-anchor="middle" fill="#292b2f" font-size="21" font-weight="500"><tspan x="1340" y="972">取得最新购物车</tspan><tspan x="1340" y="1002">按店计算起送状态</tspan></text></g><g><rect x="655" y="940" width="330" height="80" rx="16" fill="#fff9df" stroke="#dfce79" stroke-width="2"/><text x="820" text-anchor="middle" fill="#292b2f" font-size="21" font-weight="500"><tspan x="820" y="972">更新实际购物车</tspan><tspan x="820" y="1002">与各店凑单入口</tspan></text></g><g><rect x="135" y="940" width="330" height="80" rx="16" fill="#fff" stroke="#e1e3e7" stroke-width="2"/><text x="300" text-anchor="middle" fill="#292b2f" font-size="21" font-weight="500"><tspan x="300" y="987">继续凑单或选购</tspan></text></g><g><rect x="135" y="1090" width="330" height="80" rx="16" fill="#ffe052" stroke="#e8c82e" stroke-width="2"/><text x="300" text-anchor="middle" fill="#292b2f" font-size="21" font-weight="500"><tspan x="300" y="1137">进入订单确认</tspan></text></g><text x="82" y="1240" font-size="18" fill="#75787d">选择阶段只更新草稿预览；加购成功后更新实际购物车。金额是否达标与购买校验分别判断。</text></svg>
