<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1290" viewBox="0 0 1640 1290" role="img" aria-labelledby="title description"><title id="title">凑单助手 · 用户与系统流程</title><desc id="description">同店选择 → 预览金额 → 确认加购 → 按实际购物车判断起送</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#969aa1"/></marker></defs><style>text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}</style><rect width="1640" height="1290" fill="#fbfbf8"/><rect x="60" y="40" width="7" height="42" rx="3.5" fill="#f3ce29"/><text x="82" y="65" fill="#292b2f" font-size="32" font-weight="700">凑单助手 · 用户与系统流程</text><text x="82" y="94" fill="#7d8086" font-size="18">同店选择 → 预览金额 → 确认加购 → 按实际购物车判断起送</text><rect x="60" y="120" width="480" height="1075" rx="22" fill="#f1f2f3"/><rect x="60" y="120" width="480" height="64" rx="22" fill="#e7e9eb"/><rect x="60" y="155" width="480" height="29" fill="#e7e9eb"/><text x="300" text-anchor="middle" fill="#292b2f" font-size="25" font-weight="700"><tspan x="300" y="162">用户</tspan></text><rect x="580" y="120" width="480" height="1075" rx="22" fill="#fff9e9"/><rect x="580" y="120" width="480" height="64" rx="22" fill="#ffed9b"/><rect x="580" y="155" width="480" height="29" fill="#ffed9b"/><text x="820" text-anchor="middle" fill="#292b2f" font-size="25" font-weight="700"><tspan x="820" y="162">页面</tspan></text><rect x="1100" y="120" width="480" height="1075" rx="22" fill="#f1f2f3"/><rect x="1100" y="120" width="480" height="64" rx="22" fill="#e7e9eb"/><rect x="1100" y="155" width="480" height="29" fill="#e7e9eb"/><text x="1340" text-anchor="middle" fill="#292b2f" font-size="25" font-weight="700"><tspan x="1340" y="162">业务支撑职责</tspan></text><path d="M465 240 H655" fill="none" stroke="#969aa1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M985 240 H1175" fill="none" stroke="#969aa1" stroke-width="2.